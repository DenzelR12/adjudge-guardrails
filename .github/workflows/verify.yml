name: Verify guardrails

on:
  workflow_dispatch:
  push:
    paths: ["src/**", "configs/**", "tests/**", "pyproject.toml"]
  schedule:
    - cron: "0 14 * * 1-5"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: make test
      - run: make freshness
      - run: make verify
