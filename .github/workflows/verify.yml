name: Verify guardrails

on:
  workflow_dispatch:
  push:
    paths: ["src/**", "configs/**", "tests/**", "pyproject.toml"]
  schedule:
    - cron: "0 14 * * 1-5"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: make test
      - run: make freshness
      - name: Confirm sample registry fails closed
        run: |
          set +e
          make verify
          status=$?
          set -e
          if [ "$status" -ne 2 ]; then
            echo "Expected make verify to fail with Make exit status 2 for the deliberately unverifiable sample registry; got $status."
            exit 1
          fi
